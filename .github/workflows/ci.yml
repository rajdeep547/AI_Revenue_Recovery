name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate the corpus (data/ is gitignored, deterministic from seed)
        run: python datagen.py --seed 20260826 --events 2000 --out-dir data

      - name: Full test suite
        run: pytest tests/ -q

      # ---- Slice 11 break condition: re-run the freeze and diff byte-for-byte.
      # A fresh datagen + a fresh pipeline pass must reproduce the committed
      # artifacts exactly. Any drift in data, pipeline, or engine fails here.
      - name: Re-run STEP 1 and diff against results/final_run.json
        run: |
          python scripts/run_corpus.py final --out results/_verify_ci_final.json
          diff -u results/final_run.json results/_verify_ci_final.json

      - name: Re-run STEP 2 and diff against results/split_comparison_500.json
        run: |
          python scripts/run_corpus.py split --limit-customers 500 \
            --splits 70:30,90:10 --out results/_verify_ci_split_500.json
          diff -u results/split_comparison_500.json results/_verify_ci_split_500.json

      - name: README headline numbers match the frozen artifacts
        run: python scripts/render_readme_numbers.py --check
